name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.CITY_DATA_TOKEN || github.token }}

      - name: Configure submodule authentication and clone submodules
        # This uses CITY_DATA_TOKEN if set, otherwise falls back to the workflow's github.token.
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.CITY_DATA_TOKEN || github.token }}"

          # Use token for any https://github.com/ access so submodule URLs in .gitmodules work
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

          # Sync and initialize submodules (works with either relative or absolute URLs)
          git submodule sync --recursive || true
          git submodule update --init --recursive --remote

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # - name: Build PWA
      #   working-directory: web
      #   env:
      #     VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      - name: Build PWA
        working-directory: web
        env:
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          VITE_DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }} 
        run: |
          bun run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
