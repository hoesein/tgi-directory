<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF6B35" />
    <title>Directory - Taunggyi</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        text-align: center;
        padding: 20px;
      }
      .offline-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #666;
        font-size: 14px;
        margin: 0 0 24px;
      }
      button {
        background: #FF6B35;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 32px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg class="offline-icon" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#FF6B35"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#fff" stroke-width="5"/>
      <line x1="33" y1="33" x2="46" y2="46" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>You're Offline</h1>
    <p>Please check your connection and try again.</p>
    <button onclick="window.location.reload()" type="button">Retry</button>
  </body>
</html>
